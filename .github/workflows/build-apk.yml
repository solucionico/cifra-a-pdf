name: Compilar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Cifra a PDF -> APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Traer el codigo del repositorio
        uses: actions/checkout@v4

      - name: 2. Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 3. Java 17 (lo necesita el SDK de Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 4. Diagnostico del entorno
        run: |
          python3 -V
          java -version
          echo "--- disco ---"
          df -h /
          echo "--- memoria y CPUs ---"
          free -g || true
          nproc

      - name: 5. Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev libssl-dev libltdl-dev

      - name: 6. Instalar buildozer + python-for-android
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install "cython<3" "buildozer==1.5.0" "python-for-android==2024.1.21"
          python3 -c "import pythonforandroid, os; print('p4a instalado en:', os.path.dirname(pythonforandroid.__file__))"

      - name: 7. Parchear liblzma (tukaani.org responde 403)
        run: |
          set -e
          F=$(python3 -c "import pythonforandroid, os; print(os.path.join(os.path.dirname(pythonforandroid.__file__), 'recipes', 'liblzma', '__init__.py'))")
          echo "receta: $F"
          test -f "$F" || { echo "ERROR: no existe la receta en $F"; exit 1; }
          cp "$F" "$F.orig"
          sed -i 's#https://tukaani.org/xz/xz-{version}.tar.gz#https://downloads.sourceforge.net/project/lzmautils/xz-{version}.tar.gz#' "$F"
          if ! grep -q "sourceforge" "$F"; then
            echo "ERROR: el parche no se aplico. Contenido original:"
            cat "$F.orig"
            exit 1
          fi
          grep -n "url = " "$F"
          VER=$(sed -n "s/.*version = '\([^']*\)'.*/\1/p" "$F" | head -1)
          URL="https://downloads.sourceforge.net/project/lzmautils/xz-$VER.tar.gz"
          echo "verificando que se pueda bajar: $URL"
          curl -sIL -o /dev/null -w "HTTP %{http_code}\n" --max-time 60 "$URL"
          echo "OK: liblzma apunta a SourceForge (version $VER)"

      - name: 8. Compilar el APK (40-70 min la primera vez)
        run: |
          buildozer -v android debug

      - name: 9. Publicar el APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Cifra-a-PDF-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
