name: Compilar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Cifra a PDF -> APK
    runs-on: ubuntu-latest

    container:
      image: kivy/buildozer:latest

    steps:
      - name: 1. Traer el codigo del repositorio
        uses: actions/checkout@v4

      - name: 2. Guardar cache (acelera muchisimo los builds siguientes)
        uses: actions/cache@v4
        with:
          path: |
            /github/home/.buildozer
            /root/.buildozer
            /home/user/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-

      - name: 3. Parchear la descarga que devuelve 403
        run: |
          set -e
          echo "== Diagnostico =="
          echo "buildozer: $(command -v buildozer || echo NO ENCONTRADO)"
          ls -d /home/user/.venv/lib/*/site-packages 2>/dev/null || true
          /home/user/.venv/bin/python3 -m pip show python-for-android 2>&1 | head -4 || true

          echo "== Buscando la receta liblzma =="
          RECIPE="*pythonforandroid/recipes/liblzma/__init__.py"
          F=""
          for root in /home/user /usr /opt /root /github; do
            [ -d "$root" ] || continue
            echo "  buscando en $root ..."
            F=$(find "$root" -path "$RECIPE" 2>/dev/null | head -1 || true)
            [ -n "$F" ] && break
          done
          if [ -z "$F" ]; then
            echo "  buscando en todo el sistema ..."
            F=$(find / -xdev -path "$RECIPE" 2>/dev/null | head -1 || true)
          fi

          echo "receta encontrada: ${F:-NO ENCONTRADA}"
          test -n "$F" || { echo "ERROR: no encuentro la receta liblzma"; exit 1; }

          sed -i 's#https://tukaani.org/xz/xz-{version}.tar.gz#https://downloads.sourceforge.net/project/lzmautils/xz-{version}.tar.gz#' "$F"
          if grep -q "sourceforge" "$F"; then
            echo "OK: liblzma ahora baja de SourceForge"
          else
            echo "ERROR: el parche no se aplico (la receta cambio de formato)"
            exit 1
          fi
          grep -n "url = " "$F"

      - name: 4. Compilar el APK
        run: |
          buildozer -v android debug

      - name: 5. Publicar el APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Cifra-a-PDF-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
