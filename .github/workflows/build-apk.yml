name: Compilar APK

# Se ejecuta solo cada vez que subis cambios, o a mano desde la pestana Actions.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Cifra a PDF -> APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Traer el codigo del repositorio
        uses: actions/checkout@v4

      - name: 2. Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 3. Java 17 (lo necesita el SDK de Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 4. Diagnostico del entorno
        run: |
          python3 -V
          java -version
          echo "--- disco ---"
          df -h /
          free -g || true

      - name: 5. Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev libssl-dev libltdl-dev

      # Comprobaciones baratas: si falta algun archivo, falla en 5 segundos
      # en lugar de dejarte esperando una hora para nada.
      - name: 6. Verificar que los archivos esten actualizados
        run: |
          set -e
          grep -q "p4a.branch = v2024.01.21" buildozer.spec \
            || { echo "FALTA actualizar buildozer.spec (no tiene p4a.branch)"; exit 1; }
          if grep -q "^requirements.*reportlab" buildozer.spec; then
            echo "ERROR: buildozer.spec todavia pide reportlab"; exit 1
          fi
          grep -q "class _PDF" logica.py \
            || { echo "FALTA el logica.py nuevo (generador de PDF propio)"; exit 1; }
          grep -q "p4a.branch" buildozer.spec && echo "buildozer.spec OK"
          echo "logica.py OK"

      - name: 7. Instalar buildozer
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install "cython<3" "buildozer==1.5.0"
          buildozer --version

      - name: 8. Compilar el APK (40-70 min la primera vez)
        run: |
          buildozer -v android debug

      - name: 9. Publicar el APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Cifra-a-PDF-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
